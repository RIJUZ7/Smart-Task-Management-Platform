spring.application.name=taskforge-backend
spring.profiles.active=dev

# Server Port
server.port=8080

# Jackson Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger / OpenAPI UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security & JWT (256-bit Hex Key for HMAC-SHA256)
taskforge.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
taskforge.jwt.expiration-ms=86400000
taskforge.jwt.refresh-expiration-ms=604800000
